server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gitops-dr-application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

application:
  version: ${APPLICATION_VERSION:0.1.0-SNAPSHOT}
  database-url: ${DATABASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.gitopsdrsimulator: INFO
